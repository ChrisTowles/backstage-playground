apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mcp-server-typescript
  title: MCP Server (TypeScript)
  description: |
    Scaffold a new Model Context Protocol (MCP) server in TypeScript using
    @modelcontextprotocol/sdk. Includes a stdio transport entrypoint, one
    example tool, and a ready-to-run package.json.
  tags:
    - mcp
    - typescript
    - nodejs
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Server details
      required:
        - name
        - description
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the MCP server (kebab-case)
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: One-line summary of what the server does
        owner:
          title: Owner
          type: string
          description: Catalog owner (user or group)
          default: user:guest
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Fetch skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: public

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
